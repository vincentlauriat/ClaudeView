name: ClaudeView
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  ClaudeView:
    type: application
    platform: macOS
    sources: [ClaudeView]
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    info:
      path: ClaudeView/Info.plist
      properties:
        CFBundleIconFile: ClaudeView
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        LSMinimumSystemVersion: "15.0"
        SUFeedURL: https://raw.githubusercontent.com/vincentlauriat/ClaudeView/main/appcast.xml
        SUPublicEDKey: nz/9n40yF0Ei9n3Y5BCsbRjT8BeeHuTup172jlQQtSg=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ClaudeView
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
  ClaudeViewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClaudeViewTests]
    dependencies:
      - target: ClaudeView
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClaudeView:
    build:
      targets:
        ClaudeView: all
        ClaudeViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClaudeViewTests]

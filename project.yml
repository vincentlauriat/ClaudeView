name: ClaudeView
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  ClaudeView:
    type: application
    platform: macOS
    sources: [ClaudeView]
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.ClaudeView
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
  ClaudeViewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClaudeViewTests]
    dependencies:
      - target: ClaudeView
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClaudeView:
    build:
      targets:
        ClaudeView: all
        ClaudeViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClaudeViewTests]
